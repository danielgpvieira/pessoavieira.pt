<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<title>Pessoa Vieira – Engenharia e Consultoria Industrial</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- FONT BASE (fallback geral) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
    margin: 0;
    font-family: 'Inter', Arial, sans-serif;
    background: linear-gradient(to bottom, #f8fafc, #eef2f7);
    color: #1f2933;
}

.container {
    max-width: 1380px;
    margin: auto;
    padding: 24px;
}

/* HERO */
.hero {
    min-height: 220px;
    display: flex;
    align-items: center;
    padding: 40px 55px;
    border-radius: 30px;
    overflow: hidden;
    position: relative;
    color: white;
    margin-bottom: 35px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
}

.hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(rgba(15,23,42,0.82), rgba(15,23,42,0.82)),
        url('image/hero.jpg');
    background-size: cover;
    background-position: center;
    z-index: 0;
}

.hero::after {
    content: "";
    position: absolute;
    top: -50%;
    left: -20%;
    width: 55%;
    height: 200%;
    background: linear-gradient(
        to right,
        transparent,
        rgba(255,255,255,0.26),
        transparent
    );
    transform: rotate(12deg);
    animation: lightSweep 8s ease-in-out infinite;
    z-index: 1;
}

.hero-content {
    position: relative;
    z-index: 2;
    max-width: 760px;
}

/* === ALTERAÇÃO DE FONTES CONFORME ANEXO === */
.hero h1 {
    font-family: 'Glot Round', 'Arial Rounded MT Bold', Arial, sans-serif;
    font-size: 58px;
    line-height: 1.05;
    margin: 0 0 18px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
}

.hero h2 {
    font-family: 'Abadi', 'Inter', Arial, sans-serif;
    font-size: 22px;
    line-height: 1.7;
    font-weight: 400;
    color: rgba(255,255,255,0.92);
    margin: 0;
}

/* HERO LIGHT EFFECT */
@keyframes lightSweep {
    0% { left: -40%; }
    100% { left: 120%; }
}

/* TITLES */
.section-title {
    font-size: 34px;
    margin-bottom: 30px;
    font-weight: 600;
    color: #0f172a;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 35px;
}

/* CARDS */
.item {
    background: white;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    transition: transform 0.35s ease, box-shadow 0.35s ease;
}

.item:hover {
    transform: translateY(-8px);
    box-shadow: 0 22px 45px rgba(0,0,0,0.12);
}

.item img {
    width: 100%;
    height: auto;
    display: block;
    transition: transform 0.4s ease;
}

.item:hover img {
    transform: scale(1.03);
}

.item-content {
    padding: 24px;
}

.item p {
    margin: 0;
    font-size: 20px;
    line-height: 1.5;
    font-weight: 500;
    color: #1e293b;
}

/* SOBRE */
.sobre {
    margin-top: 55px;
    background: white;
    padding: 50px;
    border-radius: 30px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.06);
}

.sobre h3 {
    margin-top: 0;
    font-size: 32px;
    margin-bottom: 25px;
    color: #0f172a;
}

.sobre p {
    font-size: 19px;
    line-height: 1.9;
    color: #475569;
    margin: 0;
}

/* STATS */
.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 25px;
    margin-top: 45px;
}

.stat {
    background: white;
    padding: 35px;
    border-radius: 24px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.06);
}

.stat-number {
    font-size: 42px;
    font-weight: 700;
    color: #1d4ed8;
    margin-bottom: 12px;
}

.stat-text {
    font-size: 18px;
    color: #475569;
}

/* CONTACTOS */
.contactos {
    margin-top: 50px;
    background: white;
    padding: 50px;
    border-radius: 30px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.06);
}

.contactos h3 {
    margin-top: 0;
