<!DOCTYPE html>
<html lang="pt-PT">

<head>

  <meta charset="UTF-8">

  <title>Pessoa Vieira – Engenharia e Consultoria Industrial</title>

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <!-- FONTES -->

  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

  <!-- GLOT ROUND -->

  <link href="https://fonts.cdnfonts.com/css/glot-round"
        rel="stylesheet">

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {

      margin: 0;

      font-family: 'Inter', Arial, sans-serif;

      background:
      linear-gradient(
      to bottom,
      #f8fafc,
      #eef2f7);

      color: #1f2933;
    }

    .container {

      max-width: 1380px;

      margin: auto;

      padding: 24px;
    }

    /* HERO */

    .hero {

      min-height: 220px;

      display: flex;

      align-items: center;

      padding: 40px 55px;

      border-radius: 30px;

      overflow: hidden;

      position: relative;

      color: white;

      margin-bottom: 35px;

      box-shadow:
      0 20px 60px rgba(0,0,0,0.15);
    }

    .hero::before {

      content: "";

      position: absolute;

      inset: 0;

      background:
      linear-gradient(
      rgba(15,23,42,0.82),
      rgba(15,23,42,0.82)),
      url('image/hero.jpg');

      background-size: cover;

      background-position: center;

      z-index: 0;
    }

    .hero::after {

      content: "";

      position: absolute;

      top: -50%;

      left: -20%;

      width: 55%;

      height: 200%;

      background:
      linear-gradient(
      to right,
      transparent,
      rgba(255,255,255,0.26),
      transparent);

      transform: rotate(12deg);

      animation:
      lightSweep 8s ease-in-out infinite;

      z-index: 1;
    }

    .hero-content {

      position: relative;

      z-index: 2;

      max-width: 760px;
    }

    /* PESSOA VIEIRA */

    .hero h1 {

      font-family: 'Glot Round', sans-serif;

      font-size: 58px;

      line-height: 1.05;

      margin: 0 0 18px;

      font-weight: 300;

      letter-spacing: 12px;

      text-transform: uppercase;

      color: #ffffff;
    }

    /* SUBTÍTULO */

    .hero h2 {

      font-family: 'Abadi MT Condensed Light',
                   'Arial Narrow',
                   sans-serif;

      font-size: 22px;

      line-height: 1.7;

      font-weight: 400;

      color: rgba(255,255,255,0.92);

      margin: 0;

      letter-spacing: 0.5px;
    }

    /* HERO LIGHT EFFECT */

    @keyframes lightSweep {

      0% {
        left: -40%;
      }

      100% {
        left: 120%;
      }
    }

    /* TITLES */

    .section-title {

      font-size: 34px;

      margin-bottom: 30px;

      font-weight: 600;

      color: #0f172a;
    }

    /* GRID */

    .grid {

      display: grid;

      grid-template-columns:
      repeat(3, 1fr);

      gap: 35px;
    }

    /* CARDS */

    .item {

      background: white;

      border-radius: 24px;

      overflow: hidden;

      box-shadow:
      0 10px 35px rgba(0,0,0,0.08);

      transition:
      transform 0.35s ease,
      box-shadow 0.35s ease;
    }

    .item:hover {

      transform: translateY(-8px);

      box-shadow:
      0 22px 45px rgba(0,0,0,0.12);
    }

    .item img {

      width: 100%;

      height: auto;

      display: block;

      transition: transform 0.4s ease;
    }

    .item:hover img {
      transform: scale(1.03);
    }

    .item-content {
      padding: 24px;
    }

    .item p {

      margin: 0;

      font-size: 20px;

      line-height: 1.5;

      font-weight: 500;

      color: #1e293b;
    }

    /* SOBRE */

    .sobre {

      margin-top: 55px;

      background: white;

      padding: 50px;

      border-radius: 30px;

      box-shadow:
      0 10px 35px rgba(0,0,0,0.06);
    }

    .sobre h3 {

      margin-top: 0;

      font-size: 32px;

      margin-bottom: 25px;

      color: #0f172a;
    }

    .sobre p {

      font-size: 19px;

      line-height: 1.9;

      color: #475569;

      margin: 0;
    }

    /* STATS */

    .stats {

      display: grid;

      grid-template-columns:
      repeat(4, 1fr);

      gap: 25px;

      margin-top: 45px;
    }

    .stat {

      background: white;

      padding: 35px;

      border-radius: 24px;

      text-align: center;

      box-shadow:
      0 10px 30px rgba(0,0,0,0.06);
    }

    .stat-number {

      font-size: 42px;

      font-weight: 700;

      color: #1d4ed8;

      margin-bottom: 12px;
    }

    .stat-text {

      font-size: 18px;

      color: #475569;
    }

    /* CONTACTOS */

    .contactos {

      margin-top: 50px;

      background: white;

      padding: 50px;

      border-radius: 30px;

      box-shadow:
      0 10px 35px rgba(0,0,0,0.06);
    }

    .contactos h3 {

      margin-top: 0;

      font-size: 32px;

      margin-bottom: 20px;

      color: #0f172a;
    }

    .contactos p {

      font-size: 20px;

      line-height: 1.8;

      color: #475569;
    }

    .contactos a {

      color: #1d4ed8;

      text-decoration: none;

      font-weight: 600;
    }

    .contactos a:hover {
      text-decoration: underline;
    }

    /* FOOTER */

    footer {

      margin-top: 80px;

      text-align: center;

      padding: 30px 10px;

      color: #64748b;

      font-size: 15px;
    }

    /* RESPONSIVE */

    @media (max-width: 1100px) {

      .grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 768px) {

      .container {
        padding: 18px;
      }

      .hero {

        min-height: auto;

        padding: 35px 24px;

        border-radius: 24px;

        margin-bottom: 40px;
      }

      .hero h1 {

        font-size: 42px;

        letter-spacing: 7px;
      }

      .hero h2 {

        font-size: 19px;

        line-height: 1.6;
      }

      .section-title {

        font-size: 28px;

        margin-bottom: 25px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .item p {
        font-size: 18px;
      }

      .sobre,
      .contactos {

        padding: 35px 28px;
      }

      .sobre h3,
      .contactos h3 {

        font-size: 28px;
      }

      .sobre p,
      .contactos p {

        font-size: 17px;
      }

      .stat-number {
        font-size: 36px;
      }
    }

  </style>

</head>

<body>

  <div class="container">

    <!-- HERO -->

    <section class="hero">

      <div class="hero-content">

        <h1>PESSOA VIEIRA_</h1>

        <h2>
          Engenharia industrial para ambientes exigentes
        </h2>

      </div>

    </section>

    <!-- RESTANTE HTML MANTÉM-SE IGUAL -->

  </div>

</body>

</html>
