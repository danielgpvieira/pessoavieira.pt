<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <title>Pessoa Vieira, Lda – Engenharia e Consultoria Industrial</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Inter, Arial, Helvetica, sans-serif;
      background-color: #f6f6f6;
      color: #1f2933;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 60px 20px;
    }

    header {
      max-width: 700px;
      margin-bottom: 50px;
    }

    h1 {
      font-size: 46px;
      margin: 0 0 10px;
      font-weight: 600;
    }

    h2 {
      font-size: 22px;
      font-weight: 400;
      color: #606770;
      margin: 0;
    }

    h3 {
      font-size: 26px;
      margin-bottom: 40px;
      font-weight: 500;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 50px 40px;
    }

    .item {
      cursor: pointer;
    }

    .image-box {
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease;
    }

    .image-box:hover img {
      transform: scale(1.08);
    }

    .item p {
      margin: 0;
      font-size: 17px;
      color: #2d333a;
    }

    .contactos {
      margin-top: 60px;
      max-width: 500px;
    }

    footer {
      margin-top: 100px;
      font-size: 14px;
      color: #7a7f85;
    }
  </style>
</head>

<body>
  <div class="container">

    <header>
      <h1>Pessoa Vieira, Lda</h1>
      <h2>Engenharia e consultoria técnica para a indústria</h2>
    </header>

    <h3>Áreas de Atuação</h3>

    <div class="grid">

      <div class="item">
        <div class="image-box">
          <img src="image/engenharia.png" alt="Engenharia e consultoria industrial">
        </div>
        <p>Engenharia e consultoria industrial</p>
      </div>

      <div class="item">
        <div class="image-box">
          <img src="image/planeamento.png" alt="Planeamento e controlo da produção">
        </div>
        <p>Planeamento e controlo da produção</p>
      </div>

      <!-- Repete para os restantes -->
    </div>

    <footer>
      © Pessoa Vieira, Lda
    </footer>

  </div>
</body>
</html>
