<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<title>Pessoa Vieira – Engenharia e Consultoria Industrial</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- GOOGLE FONT BASE -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
    margin: 0;
    font-family: 'Inter', Arial, sans-serif;
    background: linear-gradient(to bottom, #f8fafc, #eef2f7);
    color: #1f2933;
}

.container {
    max-width: 1380px;
    margin: auto;
    padding: 24px;
}

/* HERO */
.hero {
    min-height: 220px;
    display: flex;
    align-items: center;
    padding: 40px 55px;
    border-radius: 30px;
    overflow: hidden;
    position: relative;
    color: white;
    margin-bottom: 35px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
}

.hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(rgba(15,23,42,0.82), rgba(15,23,42,0.82)),
        url('image/hero.jpg');
    background-size: cover;
    background-position: center;
    z-index: 0;
}

.hero-content {
    position: relative;
    z-index: 2;
}

/* FONTES CONFORME ANEXO */
.hero h1 {
    font-family: 'Glot Round', 'Arial Rounded MT Bold', Arial, sans-serif;
    font-size: 58px;
    font-weight: 700;
    margin: 0 0 18px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
}

.hero h2 {
    font-family: 'Abadi', 'Inter', Arial, sans-serif;
    font-size: 22px;
    font-weight: 400;
    margin: 0;
    color: rgba(255,255,255,0.92);
}

/* RESTANTE CSS (inalterado) */
.section-title {
    font-size: 34px;
    margin-bottom: 30px;
    font-weight: 600;
    color: #0f172a;
}

.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 35px;
}

.item {
    background: white;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 10px 35px rgba(0,0,0,0.08);
}

.item-content { padding: 24px; }
.item p { margin: 0; font-size: 20px; font-weight: 500; }

.sobre, .contactos {
    background: white;
    padding: 50px;
    border-radius: 30px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.06);
    margin-top: 50px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 25px;
    margin-top: 45px;
}

.stat {
    background: white;
    padding: 35px;
    border-radius: 24px;
    text-align: center;
}

footer {
    margin-top: 80px;
    text-align: center;
    color: #64748b;
}
</style>
</head>

<body>
<div class="container">

<section class="hero">
    <div class="hero-content">
        <h1>Pessoa Vieira</h1>
        <h2>Engenharia industrial para ambientes exigentes</h2>
    </div>
</section>

<footer>© Pessoa Vieira, Lda</footer>

</div>
</body>
</html>
``
