<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">

  <title>PESSOA VIEIRA – Engenharia e Consultoria Industrial</title>

  <meta name="description"
        content="Serviços de engenharia e consultoria industrial focados na excelência operacional, otimização da supply chain, planeamento de produção, melhoria contínua e implementação de sistemas ERP/MES.">

  <link rel="canonical" href="https://pessoavieira.pt/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- FONTES -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: 'Inter', Arial, sans-serif;
      background: linear-gradient(to bottom, #f8fafc, #eef2f7);
      color: #1f2933;
    }

    .container {
      max-width: 1380px;
      margin: auto;
      padding: 24px;
    }

    /* HERO */
    .hero {
      min-height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 45px 55px;
      border-radius: 30px;
      overflow: hidden;
      position: relative;
      color: white;
      margin-bottom: 35px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(15,23,42,0.82), rgba(15,23,42,0.82)),
        url('/image/hero.jpg');
      background-size: cover;
      background-position: center;
      z-index: 0;
    }

    .hero::after {
      content: "";
      position: absolute;
      top: -50%;
      left: -20%;
      width: 55%;
      height: 200%;
      background: linear-gradient(
        to right,
        transparent,
        rgba(255,255,255,0.18),
        transparent
      );
      transform: rotate(12deg);
      animation: lightSweep 8s ease-in-out infinite;
      z-index: 1;
    }

    @keyframes lightSweep {
      0% { left: -40%; }
      100% { left: 120%; }
    }

    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
    }

    .lang-btn {
      position: absolute;
      top: 26px;
      right: 30px;
      z-index: 5;
      color: white;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      padding: 9px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(8px);
    }

    .hero-logo {
      width: 100%;
      max-width: 1050px;
    }

    .section-title {
      font-size: 34px;
      margin-bottom: 30px;
      font-weight: 600;
      color: #0f172a;
    }

    /* COOKIE BANNER */
    .cookie-banner {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: rgba(15,23,42,0.96);
      color: white;
      padding: 20px 24px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      z-index: 9999;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    .cookie-banner p {
      margin: 0;
      font-size: 15px;
      line-height: 1.5;
      flex: 1;
    }

    .cookie-banner button {
      background: #1d4ed8;
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    /* COOKIE BANNER MOBILE */
    @media (max-width: 768px) {
      .cookie-banner {
        flex-direction: column;
        align-items: stretch;
        text-align: center;
        padding: 28px;
      }

      .cookie-banner p {
        font-size: 16px;
        line-height: 1.7;
      }

      .cookie-banner button {
        width: 100%;
        padding: 16px;
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
<div class="container">

  <!-- HERO -->
  <section class="hero">
    <a href="/en/" class="lang-btn">EN</a>
    <div class="hero-content">
      <img src="/image/logo.png" alt="Pessoa Vieira" class="hero-logo">
    </div>
  </section>

  <!-- CONTEÚDO DO SITE (inalterado) -->

  <footer>© Pessoa Vieira, Lda</footer>
</div>

<!-- COOKIE BANNER -->
<div id="cookie-banner" class="cookie-banner">
  <p>
    Este website utiliza cookies para garantir o seu correto funcionamento e
    melhorar a experiência de navegação.
  </p>
  <button id="accept-cookies">Aceitar</button>
</div>

<script>
  const banner = document.getElementById('cookie-banner');
  const button = document.getElementById('accept-cookies');

  if (localStorage.getItem('cookiesAccepted')) {
    banner.remove();
  }

  button.addEventListener('click', () => {
    localStorage.setItem('cookiesAccepted', 'true');
    banner.remove();
  });
</script>

</body>
</html>
