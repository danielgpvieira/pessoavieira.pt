<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<title>Pessoa Vieira – Engenharia e Consultoria Industrial</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- GOOGLE FONTS -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Nunito:wght@600;700;800&family=Source+Sans+3:wght@400;500&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
    margin: 0;
    font-family: 'Inter', Arial, sans-serif;
    background: linear-gradient(to bottom, #f8fafc, #eef2f7);
    color: #1f2933;
}

.container {
    max-width: 1380px;
    margin: auto;
    padding: 24px;
}

/* HERO */
.hero {
    min-height: 220px;
    display: flex;
    align-items: center;
    padding: 40px 55px;
    border-radius: 30px;
    overflow: hidden;
    position: relative;
    color: white;
    margin-bottom: 35px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
}

.hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(rgba(15,23,42,0.82), rgba(15,23,42,0.82)),
        url('image/hero.jpg');
    background-size: cover;
    background-position: center;
}

.hero-content {
    position: relative;
    z-index: 2;
    max-width: 760px;
}

/* TÍTULOS COM FONTES GOOGLE (SUBSTITUTAS) */
.hero h1 {
    font-family: 'Nunito', Arial, sans-serif;
    font-size: 58px;
    line-height: 1.05;
    margin: 0 0 16px;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
}

.hero h2 {
    font-family: 'Source Sans 3', Arial, sans-serif;
    font-size: 22px;
    line-height: 1.7;
    font-weight: 400;
    color: rgba(255,255,255,0.92);
    margin: 0;
}

/* TÍTULOS */
.section-title {
    font-size: 34px;
    margin-bottom: 30px;
    font-weight: 600;
    color: #0f172a;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 35px;
}

/* CARDS */
.item {
    background: white;
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 10px 35px rgba(0,0,0,0.08);
}

.item-content {
    padding: 24px;
}

.item p {
    margin: 0;
    font-size: 20px;
    line-height: 1.5;
    font-weight: 500;
    color: #1e293b;
}

/* SOBRE */
.sobre {
    margin-top: 55px;
    background: white;
    padding: 50px;
    border-radius: 30px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.06);
}

.sobre h3 {
    margin-top: 0;
    font-size: 32px;
    margin-bottom: 25px;
    color: #0f172a;
}

.sobre p {
    font-size: 19px;
    line-height: 1.9;
    color: #475569;
}

/* STATS */
.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 25px;
    margin-top: 45px;
}

.stat {
    background: white;
    padding: 35px;
    border-radius: 24px;
    text-align: center;
}

.stat-number {
    font-size: 42px;
    font-weight: 700;
    color: #1d4ed8;
}

/* CONTACTOS */
.contactos {
    margin-top: 50px;
    background: white;
    padding: 50px;
    border-radius: 30px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.06);
}

.contactos a {
    color: #1d4ed8;
    text-decoration: none;
    font-weight: 600;
}

/* FOOTER */
footer {
    margin-top: 80px;
    text-align: center;
    color: #64748b;
    font-size: 15px;
}

/* RESPONSIVE */
@media (max-width: 768px) {
    .hero h1 { font-size: 42px; }
    .hero h2 { font-size: 19px; }
    .grid { grid-template-columns: 1fr; }
    .stats { grid-template-columns: 1fr; }
}
</style>
</head>

<body>
<div class="container">

<section class="hero">
    <div class="hero-content">
        <h1>Pessoa Vieira</h1>
        <h2>Engenharia industrial para ambientes exigentes</h2>
    </div>
</section>

<footer>© Pessoa Vieira, Lda</footer>

</div>
</body>
</html>
</html>
